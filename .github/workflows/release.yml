# Signed, published release with build provenance + SBOM.
#
# On a version tag (v*), build the omni-shell image, push it to GHCR, generate a CycloneDX SBOM, and
# produce cryptographically verifiable SLSA build-provenance + SBOM attestations (keyless, via
# Sigstore/GitHub OIDC — no long-lived signing key to manage) bound to the PUSHED registry digest.
# Because the attestation subject is the published `ghcr.io/<owner>/<repo>@sha256:…` digest, a consumer
# can verify the image they actually pulled:
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#
# closing the "is this really the build for that tag, and is this the image I pulled?" supply-chain gap.
# The image is also still source-buildable (users can build their own from the same Dockerfile); the
# published image is an additive, verifiable artifact.
#
# SBOM + provenance live on the IMAGE, not the Release. The CycloneDX SBOM and both attestations are
# pushed to GHCR as OCI referrers on the pushed digest (and the SBOM is kept as a workflow artifact),
# NOT attached to the GitHub Release. This is deliberate: the repo has immutable releases enabled, and
# a release locks the moment it is published — so attaching assets to it afterwards is rejected
# ("Cannot upload assets to an immutable release"), which previously failed the whole release run and
# skipped the attestations. Binding the supply-chain evidence to the registry digest instead is both
# immutability-proof and strictly more verifiable (a consumer checks the image they pulled, not a file
# dangling off a release page). Retrieve the SBOM with:
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner> --predicate-type https://cyclonedx.org/bom
#
# Release NOTES are authored/published separately (manually in the UI, or by the best-effort step below
# when no release exists yet); the workflow never blocks on the Release.
name: release

on:
  push:
    # This repo tags releases BARE (0.8.0, 0.6.0, …): the second pattern is the one that fires.
    # "v*" is kept so a future v-prefixed tag also releases. The trailing "*" on the semver
    # pattern admits pre-release suffixes (0.9.0-rc.1). github.ref_name is used verbatim
    # downstream (docker tag, GHCR tag, release name), so both shapes work unchanged.
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR
  id-token: write # keyless Sigstore signing (OIDC)
  attestations: write # record build-provenance + SBOM attestations

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the omni-shell image
        run: docker build -t omni-shell:${{ github.ref_name }} .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push to GHCR
        id: push
        run: |
          set -euo pipefail
          # GHCR image paths must be lowercase; ${{ github.repository }} can carry uppercase.
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          docker tag omni-shell:${{ github.ref_name }} "$image:${{ github.ref_name }}"
          docker push "$image:${{ github.ref_name }}"
          # Capture the registry MANIFEST digest (sha256:…) the push produced — this, not the local
          # image .Id, is what `gh attestation verify` resolves a pulled image against.
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:${{ github.ref_name }}" | cut -d '@' -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: omni-shell:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Keep the SBOM as a workflow artifact, but do NOT attach it to the GitHub Release:
          # the release is immutable once published, so an asset upload is rejected and fails the run.
          # The SBOM is instead bound to the image digest by the attest-sbom step below (OCI referrer).
          upload-artifact: true
          upload-release-assets: false

      - name: Attest build provenance for the pushed image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # also store the attestation in GHCR as an OCI referrer

      - name: Attest the SBOM against the pushed image
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      # Publish release NOTES only — never attach assets (immutable releases reject that), and never
      # fail the run on the Release. If the release was already published (e.g. manually in the UI,
      # which is how this repo cuts releases), it is locked and this step is a harmless no-op; if no
      # release exists yet for the tag, this creates one with auto-generated notes. The supply-chain
      # evidence rides on the image (above), so a locked/absent release never costs us an attestation.
      - name: Publish the GitHub Release notes (best-effort)
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
