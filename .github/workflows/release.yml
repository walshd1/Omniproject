# Signed, published release with build provenance + SBOM.
#
# On a version tag (v*), build the omni-shell image, push it to GHCR, generate a CycloneDX SBOM, and
# produce cryptographically verifiable SLSA build-provenance + SBOM attestations (keyless, via
# Sigstore/GitHub OIDC — no long-lived signing key to manage) bound to the PUSHED registry digest.
# Because the attestation subject is the published `ghcr.io/<owner>/<repo>@sha256:…` digest, a consumer
# can verify the image they actually pulled:
#
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#
# closing the "is this really the build for that tag, and is this the image I pulled?" supply-chain gap.
# The image is also still source-buildable (users can build their own from the same Dockerfile); the
# published image is an additive, verifiable artifact, and the SBOM is attached to the GitHub Release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR
  id-token: write # keyless Sigstore signing (OIDC)
  attestations: write # record build-provenance + SBOM attestations

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the omni-shell image
        run: docker build -t omni-shell:${{ github.ref_name }} .

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push to GHCR
        id: push
        run: |
          set -euo pipefail
          # GHCR image paths must be lowercase; ${{ github.repository }} can carry uppercase.
          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          docker tag omni-shell:${{ github.ref_name }} "$image:${{ github.ref_name }}"
          docker push "$image:${{ github.ref_name }}"
          # Capture the registry MANIFEST digest (sha256:…) the push produced — this, not the local
          # image .Id, is what `gh attestation verify` resolves a pulled image against.
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:${{ github.ref_name }}" | cut -d '@' -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: omni-shell:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest build provenance for the pushed image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true # also store the attestation in GHCR as an OCI referrer

      - name: Attest the SBOM against the pushed image
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Publish the GitHub Release with the signed SBOM
        uses: softprops/action-gh-release@v3
        with:
          files: sbom.cyclonedx.json
          generate_release_notes: true
